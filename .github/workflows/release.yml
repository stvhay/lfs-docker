name: Release

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Unreleased section
        id: check
        run: |
          if grep -q "^## Unreleased" CHANGELOG.md; then
            echo "has_unreleased=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_unreleased=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute and update version
        if: steps.check.outputs.has_unreleased == 'true'
        id: version
        run: |
          chmod +x compute-version.sh
          ./compute-version.sh --ci --update
          NEW_VERSION=$(cat VERSION)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for release
        if: steps.check.outputs.has_unreleased == 'true'
        id: changelog
        run: |
          # Extract the content for the new version section
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG=$(sed -n "/^## v${VERSION}/,/^## v/p" CHANGELOG.md | sed '$d')
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.check.outputs.has_unreleased == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git push

      - name: Create release tag
        if: steps.check.outputs.has_unreleased == 'true'
        run: |
          TAG="$(date -u +%Y-%m-%dT%H%M%SZ)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.check.outputs.has_unreleased == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
